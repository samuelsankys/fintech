name: fintech

services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: fintech-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092,CONTROLLER://0.0.0.0:19093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: fintech-local-kraft-cluster
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  postgres:
    image: postgres:16
    container_name: fintech-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - ./init-scripts/postgres:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: fintech-redis
    ports:
      - "16379:6379" # host-only; another local project already holds 6379. Services on the fintech docker network still reach it at redis:6379.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: fintech-mongo
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  ledger-service:
    build: ../services/ledger-service
    container_name: fintech-ledger-service
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  accounts-service:
    build: ../services/accounts-service
    container_name: fintech-accounts-service
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy

  identity-service:
    build: ../services/identity-service
    container_name: fintech-identity-service
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy

  payments-service:
    build: ../services/payments-service
    container_name: fintech-payments-service
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  fraud-service:
    build: ../services/fraud-service
    container_name: fintech-fraud-service
    ports:
      - "8091:8091"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  bff-gateway:
    build: ../services/bff-gateway
    container_name: fintech-bff-gateway
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy

  statements-service:
    build: ../services/statements-service
    container_name: fintech-statements-service
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  notification-service:
    build: ../services/notification-service
    container_name: fintech-notification-service
    ports:
      - "3002:3002"
    environment:
      PORT: "3002"
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  postgres-data:
